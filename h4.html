
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 - Pizza Fantasia</title>

    <!-- Markdown-muunnin -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

    <style>
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #222;
            background-color: #fff;
        }

        h1, h2, h3 {
            line-height: 1.3;
            margin-top: 1.5em;
        }

        p {
            margin: 0.8em 0;
        }

        pre {
            background-color: #f4f4f4;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            line-height: 1.5;
            border: 1px solid #ddd;
        }

        pre code {
            background: none;
            padding: 0;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
            white-space: pre;
        }

        code {
            background-color: #f4f4f4;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
        }

        ul, ol {
            padding-left: 30px;
        }

        li {
            margin-bottom: 5px;
        }

        hr {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }

        a {
            color: #0969da;
        }
    </style>
</head>

<body>

<div id="content">
    <p>Ladataan raporttia...</p>
</div>

<script>
    const markdownUrl =
        "https://raw.githubusercontent.com/Sebuare/Palvelinten-hallinta---ICI001AS3A-3015/main/h4.md";

    fetch(markdownUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error("Raportin lataaminen epäonnistui.");
            }

            return response.text();
        })
        .then(markdown => {
            const html = marked.parse(markdown, {
                gfm: true,
                breaks: false
            });

            document.getElementById("content").innerHTML = html;
        })
        .catch(error => {
            document.getElementById("content").innerHTML =
                "<p>Raportin lataaminen epäonnistui. Tarkista internet-yhteys tai h4.md-tiedoston sijainti.</p>";

            console.error(error);
        });
</script>

</body>
</html>
